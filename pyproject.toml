[project]
name = "rapport"
version = "0.1.0"
description = "Rapport: conference networking agents with private memory (Cloud Native Hackathon)"
requires-python = ">=3.12"
# One shared dependency set for every service so subagents rarely touch this file.
# Need something new? `uv add <pkg>` in your PR and say so in the PR description.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "elasticsearch>=9.0",
  "openai>=1.50",
  "pypdf>=4.0",
  "kopf>=1.37",
  "kubernetes>=30.1",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "openlit>=1.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[tool.uv]
# Not packaged: code lives in src/ and runs with PYTHONPATH=src (set in Dockerfile, Makefile and pytest).
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Explicit so CI and every laptop agree (pyflakes + pycodestyle errors only).
select = ["E", "F"]
