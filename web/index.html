<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapport · Demo stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="stage.css">
</head>
<body>
<header class="toolbar" id="toolbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Rapport</span>
    <span class="brand-tag">Agents that network for you</span>
  </div>
  <div class="controls" role="group" aria-label="Presenter controls">
    <span id="mode-badge" class="mode-badge" role="status">Mock mode</span>
    <label class="check">
      <input type="checkbox" id="malicious">
      <span>Malicious responder</span>
    </label>
    <button type="button" id="theme-btn" class="tb-btn" aria-pressed="true">Dark theme</button>
    <button type="button" id="reset-btn" class="tb-btn">Reset demo</button>
    <button type="button" id="fs-btn" class="tb-btn" aria-label="Enter full screen">Full screen</button>
    <button type="button" id="hide-btn" class="tb-btn tb-icon" aria-label="Hide presenter controls" aria-controls="toolbar" aria-expanded="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>
    </button>
  </div>
</header>
<button type="button" id="show-btn" class="show-tab" aria-label="Show presenter controls" aria-controls="toolbar" aria-expanded="false" hidden>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>

<main class="stage" id="stage">
  <section class="device" data-persona="acme.ava" data-name="Ava" data-role="Solutions Engineer, Acme Observability"></section>
  <section class="device" data-persona="bluefin.bo" data-name="Bo" data-role="Platform Lead, Bluefin Health"></section>
</main>

<!-- One iPhone frame, cloned for each phone by stage.js. -->
<template id="device-template">
  <p class="device-label"><strong></strong><span></span></p>
  <div class="device-box">
    <div class="iphone">
      <span class="hw hw-action" aria-hidden="true"></span>
      <span class="hw hw-vol-up" aria-hidden="true"></span>
      <span class="hw hw-vol-down" aria-hidden="true"></span>
      <span class="hw hw-power" aria-hidden="true"></span>
      <div class="screen">
        <div class="statusbar" aria-hidden="true">
          <span class="sb-time">9:41</span>
          <span class="sb-icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4a6.7 6.7 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c-.6 0-1.1.2-1.5.6L8 11.6l1.5-1.7c-.4-.4-.9-.6-1.5-.6Z"></path></svg>
            <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" stroke="currentColor" opacity=".4"></rect><rect x="2" y="2" width="18" height="9" rx="2.5" fill="currentColor"></rect><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" opacity=".45"></path></svg>
          </span>
        </div>
        <span class="island" aria-hidden="true"></span>
        <iframe></iframe>
        <span class="home-indicator" aria-hidden="true"></span>
      </div>
    </div>
  </div>
</template>

<script type="module" src="stage.js"></script>
</body>
</html>
