# Owned by the policy-ci workstream. Argo CD builds deploy/ with kustomize on every push to main.
#
# Argo CD's kustomize can't read files outside deploy/, so the Rego and per-company data live
# HERE and policy/ keeps only the tests (`opa test deploy/policy policy`). Generate one
# `opa-policy` ConfigMap per company namespace, for example:
#
#   configMapGenerator:
#     - name: opa-policy
#       namespace: org-acme
#       files: [rapport.rego, data.json=data/acme.json]
#     - name: opa-policy
#       namespace: org-bluefin
#       files: [rapport.rego, data.json=data/bluefin.json]
#
# The opa containers use the pinned openpolicyagent/opa image (not `app`), with explicit
# requests AND limits (rapport_common.names.RESOURCES_SMALL).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
