# Owned by the operator workstream. sample-encounter.yaml is deliberately NOT listed: Argo CD would
# keep re-creating it after the TTL deletes it. Apply it by hand (see the file).
# Every container: image `app` (kustomize swaps in GHCR), explicit requests AND limits
# (rapport_common.names.RESOURCES_*), and names.SECURITY_CONTEXT.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
