# One namespace per company (the trust boundary). The gateway and operator run in
# team-rapport, which the platform created; it is not declared here.
apiVersion: v1
kind: Namespace
metadata:
  name: org-acme
  labels:
    app.kubernetes.io/part-of: rapport
    rapport.dev/org: acme
---
apiVersion: v1
kind: Namespace
metadata:
  name: org-bluefin
  labels:
    app.kubernetes.io/part-of: rapport
    rapport.dev/org: bluefin
