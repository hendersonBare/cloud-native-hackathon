# Baseline ingress isolation for each company namespace.
# Result: nothing from another company can reach a company's pods, except the
# per-encounter policy the operator adds (initiator delegate -> responder delegate).
# The gateway (team-rapport, role=gateway) may call briefers. Egress is left open (Elastic Cloud,
# OpenAI and Dash0 are outside the cluster).
#
# ---------------- org-acme ----------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: org-acme }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-same-namespace, namespace: org-acme }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-gateway-to-briefer, namespace: org-acme }
spec:
  podSelector:
    matchLabels: { rapport.dev/role: briefer }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: team-rapport }
          podSelector:
            matchLabels: { rapport.dev/role: gateway }
      ports:
        - { protocol: TCP, port: 8080 }
---
