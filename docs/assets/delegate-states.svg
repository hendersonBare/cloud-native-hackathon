<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 494" width="1240" height="494" role="img" aria-labelledby="t d">
<title id="t">The delegate state machine</title>
<desc id="d">State machine of one delegate pod. The Job starts with TRACEPARENT in state waiting. When the peer's /healthz answers (30 s max) it moves to hello, round 1, where cards are exchanged; then offers_asks, round 2, where each offer is checked by OPA; then answers_followups, round 3, where each answer is checked by OPA; then brief, which posts shared_brief, and done, exit 0. Two failure paths lead to failed, exit non-zero, which reports delegate_status failed: from waiting when the peer is never ready, and from offers_asks on a timeout of 20 s per call or 90 s in all. A policy deny is not a failure: a denied offer is dropped, a denied answer goes back as declined, each deny is reported as a policy_decision with its rule_id, and the exchange goes on.</desc>
