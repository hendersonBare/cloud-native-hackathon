opacity:0}}.s0{animation-name:s0}@keyframes s1{0%{opacity:0}11.44%{opacity:0}12.44%,17.88%{opacity:1}18.81%{opacity:0}63.19%{opacity:0}64.19%,67.44%{opacity:1}68.38%{opacity:0}100%{opacity:0}}.s1{animation-name:s1}@keyframes s2{0%{opacity:0}19.75%{opacity:0}20.75%,26.19%{opacity:1}27.13%{opacity:0}68.94%{opacity:0}69.94%,72.56%{opacity:1}73.50%{opacity:0}100%{opacity:0}}.s2{animation-name:s2}@keyframes s3{0%{opacity:0}28.06%{opacity:0}29.06%,34.50%{opacity:1}35.44%{opacity:0}100%{opacity:0}}.s3{animation-name:s3}@keyframes s4{0%{opacity:0}36.38%{opacity:0}37.38%,42.81%{opacity:1}43.75%{opacity:0}100%{opacity:0}}.s4{animation-name:s4}@keyframes s5{0%{opacity:0}44.69%{opacity:0}45.69%,53.75%{opacity:1}54.69%{opacity:0}100%{opacity:0}}.s5{animation-name:s5}@keyframes to{0%,72.56%{opacity:0}73.81%{opacity:1}75.69%{opacity:.35}77.56%,95.62%{opacity:1}98.75%,100%{opacity:0}}@keyframes fe{0%,76.94%{stroke-dashoffset:100;opacity:1}83.19%,95.62%{stroke-dashoffset:0;opacity:1}98.75%,100%{stroke-dashoffset:0;opacity:0}}@keyframes ff{0%,83.19%{opacity:0}84.12%{opacity:1}86.00%{opacity:.2}87.88%{opacity:1}89.75%{opacity:.2}91.62%,95.62%{opacity:1}98.75%,100%{opacity:0}}.tk{animation-name:tk}.tr{animation-name:tr}.to{animation-name:to}.fe{animation-name:fe}.ff{animation-name:ff}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1240" height="494" rx="16" fill="#faf8f4"/>
<text x="36" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#16181c">Each delegate is a small state machine</text>
<text x="36" y="80" font-size="15" fill="#4a4740">One pod per company per encounter. It walks the three rounds, or stops on a timeout and reports failed.</text>
<text x="36.0" y="136" text-anchor="start" font-size="15" fill="#4a4740">Job starts with</text>
<text x="36.0" y="157" text-anchor="start" font-size="15" fill="#4a4740">TRACEPARENT</text>
