<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 642" width="1240" height="642" role="img" aria-labelledby="t d">
<title id="t">The Rapport loop</title>
<desc id="d">A loop of seven stations. Discover: filter, research and swipe. Deep dive: a plan plus a guarded decision, where the agent picks agent_handshake, or human_intro or skip, which leave the loop as a suggestion, not a request. They accept: a person always decides; Bo taps Accept. Encounter on Kubernetes: one delegate pod per company. Three rounds: hello; offers and asks; answers and follow-ups. Briefs: private and shared, in your language. Memory: the encounter summary and follow-ups, which feed the next Discover, as when Ava asks what did we promise Bluefin. A token travels the loop and each station lights up as it arrives.</desc>
