  .h-bar1{animation:kbar1 15s linear infinite}
  .h-track{animation:ktrack 15s linear infinite}
  .h-glow{animation:kglow 15s linear infinite}
  .h-r1{animation:kr1 15s linear infinite}
  .h-r3{animation:kr3 15s linear infinite}
