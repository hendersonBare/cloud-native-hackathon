  </style>
  <rect width="1240" height="380" rx="16" fill="#faf8f4"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="35" y="48" font-size="22" font-weight="700" fill="#16181c">Every item that leaves a company crosses three walls</text>
    <text x="35" y="78" font-size="15" fill="#4a4740">① Elasticsearch API key scope · ② Kubernetes NetworkPolicy per encounter · ③ OPA policy per company. The delegate can't leak what it never saw.</text>

    <g font-size="13" fill="#4a4740">
      <rect x="30" y="120" width="165" height="100" rx="12" fill="#ffffff" stroke="#16181c" stroke-width="1.5"/>
      <rect class="fx h-sm" x="30" y="120" width="165" height="100" rx="12" fill="#f8f0e0" stroke="#8a5a14" stroke-width="2.5"/>
      <text x="44" y="148" font-size="16" font-weight="700" fill="#16181c">Shareable memory</text>
      <text x="44" y="172">acme-shareable index</text>
      <text x="44" y="192">+ the conference index</text>
      <circle class="fx ring h-r1" cx="185" cy="120" r="13" fill="#d9c7a3" stroke="#8a5a14" stroke-width="2.5"/><circle cx="185" cy="120" r="13" fill="#8a5a14"/><text x="185" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>

      <rect x="233" y="120" width="165" height="100" rx="12" fill="#ffffff" stroke="#16181c" stroke-width="1.5"/>
      <rect class="fx h-dp" x="233" y="120" width="165" height="100" rx="12" fill="#f8f0e0" stroke="#8a5a14" stroke-width="2.5"/>
      <text x="247" y="148" font-size="16" font-weight="700" fill="#16181c">Delegate pod</text>
      <text x="247" y="172">one Job per encounter</text>
      <text x="247" y="192">lives about a minute</text>

      <rect x="436" y="120" width="165" height="100" rx="12" fill="#ffffff" stroke="#16181c" stroke-width="1.5"/>
      <rect class="fx h-llm" x="436" y="120" width="165" height="100" rx="12" fill="#f8f0e0" stroke="#8a5a14" stroke-width="2.5"/>
      <text x="450" y="148" font-size="16" font-weight="700" fill="#16181c">LLM proposes</text>
      <text x="450" y="172">8 s cap, then rules</text>
      <text x="450" y="192">known item IDs only</text>

      <rect x="639" y="120" width="165" height="100" rx="12" fill="#ffffff" stroke="#16181c" stroke-width="1.5"/>
      <rect class="fx h-opa" x="639" y="120" width="165" height="100" rx="12" fill="#f8f0e0" stroke="#8a5a14" stroke-width="2.5"/>
      <rect class="fx h-opaG" x="639" y="120" width="165" height="100" rx="12" fill="#e6f2ea" stroke="#1e7a45" stroke-width="2.5"/>
      <rect class="fx h-opaR" x="639" y="120" width="165" height="100" rx="12" fill="#fbeae8" stroke="#b3261e" stroke-width="3"/>
      <text x="653" y="148" font-size="16" font-weight="700" fill="#16181c">OPA decides</text>
      <text x="653" y="172">7 rules, first match</text>
      <text x="653" y="192">fails closed at 2 s</text>
      <circle class="fx ring h-r3" cx="794" cy="120" r="13" fill="#d9c7a3" stroke="#8a5a14" stroke-width="2.5"/><circle class="fx ring h-r3r" cx="794" cy="120" r="13" fill="#f3d3cf" stroke="#b3261e" stroke-width="2.5"/><circle cx="794" cy="120" r="13" fill="#8a5a14"/><text x="794" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>

      <rect x="842" y="120" width="165" height="100" rx="12" fill="#ffffff" stroke="#16181c" stroke-width="1.5"/>
      <rect class="fx h-peer" x="842" y="120" width="165" height="100" rx="12" fill="#f8f0e0" stroke="#8a5a14" stroke-width="2.5"/>
      <text x="856" y="148" font-size="16" font-weight="700" fill="#16181c">Peer delegate</text>
      <text x="856" y="172">NetworkPolicy admits</text>
      <text x="856" y="192">only this encounter</text>
      <circle class="fx ring h-r2" cx="997" cy="120" r="13" fill="#d9c7a3" stroke="#8a5a14" stroke-width="2.5"/><circle cx="997" cy="120" r="13" fill="#8a5a14"/><text x="997" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>

      <rect class="fx h-glow" x="1045" y="120" width="165" height="100" rx="12" fill="#c9a25f" filter="url(#blur)"/>
      <rect x="1045" y="120" width="165" height="100" rx="12" fill="#16181c"/>
      <rect class="fx h-track" x="1059" y="205" width="137" height="4" rx="2" fill="#3a3a3a"/>
      <rect class="fx bar h-bar0" x="1059" y="205" width="66" height="4" rx="2" fill="#d9c7a3"/>
      <rect class="fx bar h-bar1" x="1130" y="205" width="66" height="4" rx="2" fill="#d9c7a3"/>
      <text x="1059" y="148" font-size="16" font-weight="700" fill="#efebe4">Shared brief</text>
      <text x="1059" y="172" fill="#d8d3c8">summaries, never text</text>
      <text x="1059" y="192" fill="#d8d3c8">in your own language</text>

    </g>

    <g stroke="#16181c" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M195 170 H229"/>
      <path d="M398 170 H432"/>
      <path d="M601 170 H635"/>
      <path d="M804 170 H838"/>
      <path d="M1007 170 H1041"/>
    </g>
    <text x="821" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1e7a45">allow</text>

    <path d="M721 220 V262" stroke="#b3261e" stroke-width="2" fill="none" marker-end="url(#r)"/>
    <text x="729" y="246" font-size="12" font-weight="700" fill="#b3261e">deny</text>
    <g>
      <use class="fx h-c0a" href="#chipW"/>
      <use class="fx h-c0b" href="#chipG"/>
      <use class="fx h-c1a" href="#chipW"/>
      <use class="fx h-c1b" href="#chipG"/>
      <use class="fx h-c2a" href="#chipW"/>
      <use class="fx h-c2b" href="#chipR"/>
    </g>
    <rect x="560" y="266" width="320" height="76" rx="12" fill="#fbeae8" stroke="#b3261e" stroke-width="1.5"/>
    <rect class="fx h-drop" x="560" y="266" width="320" height="76" rx="12" fill="#f8dcd8" stroke="#b3261e" stroke-width="3"/>
    <rect class="fx h-rule" x="644" y="320" width="146" height="17" rx="4" fill="#f0bdb7"/>
    <text x="576" y="292" font-size="15" font-weight="700" fill="#b3261e">Dropped, and reported</text>
    <text x="576" y="314" font-size="13" fill="#4a4740">a policy_decision event with its rule_id,</text>
    <text x="576" y="332" font-size="13" fill="#4a4740">for example pricing_needs_approval</text>

    <rect x="35" y="266" width="370" height="76" rx="12" fill="#ebe7df" stroke="#8c877c" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="51" y="292" font-size="15" font-weight="700" fill="#16181c">Never leaves the company</text>
    <g class="lock" transform="translate(383 287) scale(.8) translate(-383 -285)" fill="none" stroke="#8c877c" stroke-width="2" stroke-linecap="round"><path d="M377 284 V279.5 A6 6 0 0 1 389 279.5 V284"/><rect x="374" y="284" width="18" height="13" rx="3" fill="#8c877c" stroke="none"/><circle cx="383" cy="289.5" r="1.8" fill="#ebe7df" stroke="none"/></g>
    <text x="51" y="314" font-size="13" fill="#4a4740">rapport-acme-internal (acme-doc-0008, acme-note-0007),</text>
    <text x="51" y="332" font-size="13" fill="#4a4740">private profiles, record text, prompts</text>

    <text x="1205" y="292" text-anchor="end" font-size="13" fill="#4a4740">Bluefin's side is the mirror image:</text>
    <text x="1205" y="312" text-anchor="end" font-size="13" fill="#4a4740">its own key, its own OPA, its own namespace.</text>
  </g>
</svg>
