  @keyframes kc0a{0%{opacity:0;transform:translate(197px,176px)} 6.60%{opacity:0;transform:translate(197px,176px)} 7.20%{opacity:1;transform:translate(202px,176px)} 9.47%{opacity:1;transform:translate(226px,176px)} 10.00%{opacity:0;transform:translate(231px,176px)} 13.93%{opacity:0;transform:translate(400px,176px)} 14.53%{opacity:1;transform:translate(405px,176px)} 16.80%{opacity:1;transform:translate(429px,176px)} 17.33%{opacity:0;transform:translate(434px,176px)} 21.27%{opacity:0;transform:translate(603px,176px)} 21.87%{opacity:1;transform:translate(608px,176px)} 24.13%{opacity:1;transform:translate(632px,176px)} 24.67%{opacity:0;transform:translate(637px,176px)} 100%{opacity:0;transform:translate(637px,176px)}}
  @keyframes kc0b{0%{opacity:0;transform:translate(806px,176px)} 31.27%{opacity:0;transform:translate(806px,176px)} 31.87%{opacity:1;transform:translate(811px,176px)} 34.13%{opacity:1;transform:translate(835px,176px)} 34.67%{opacity:0;transform:translate(840px,176px)} 38.60%{opacity:0;transform:translate(1009px,176px)} 39.20%{opacity:1;transform:translate(1014px,176px)} 41.47%{opacity:1;transform:translate(1038px,176px)} 42.00%{opacity:0;transform:translate(1043px,176px)} 100%{opacity:0;transform:translate(1043px,176px)}}
