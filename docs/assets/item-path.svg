  @keyframes kr3{0%{opacity:0;transform:scale(1)} 28.20%{opacity:0;transform:scale(1)} 28.33%{opacity:1;transform:scale(1)} 33.00%{opacity:0;transform:scale(1.5)} 33.13%{opacity:0;transform:scale(1)} 42.87%{opacity:0;transform:scale(1)} 43.00%{opacity:1;transform:scale(1)} 47.67%{opacity:0;transform:scale(1.5)} 47.80%{opacity:0;transform:scale(1)} 100%{opacity:0;transform:scale(1)}}
  @keyframes kr2{0%{opacity:0;transform:scale(1)} 39.20%{opacity:0;transform:scale(1)} 39.33%{opacity:1;transform:scale(1)} 44.00%{opacity:0;transform:scale(1.5)} 44.13%{opacity:0;transform:scale(1)} 53.87%{opacity:0;transform:scale(1)} 54.00%{opacity:1;transform:scale(1)} 58.67%{opacity:0;transform:scale(1.5)} 58.80%{opacity:0;transform:scale(1)} 100%{opacity:0;transform:scale(1)}}
