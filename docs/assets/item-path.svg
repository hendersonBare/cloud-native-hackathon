<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 380" width="1240" height="380" role="img" aria-labelledby="t d">
  <title id="t">The path of every item that leaves a company</title>
  <desc id="d">Shareable memory, read with a scoped Elasticsearch key, goes to a short-lived delegate pod. The LLM proposes items by known ID only. OPA allows or denies each one; a deny drops the item and reports the rule. Allowed items reach the peer delegate through a per-encounter NetworkPolicy and end up as summaries in the shared brief. Internal memory, private profiles, record text and prompts never leave. Animated: three items travel the path; two are allowed into the shared brief and the third, a pricing document, is denied by OPA and dropped with the rule pricing_needs_approval.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16181c"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/>
    </marker>

    <g id="chipW">
      <path d="M-8 -10.5 H2 L8 -4.5 V10.5 H-8 Z" fill="#ffffff" stroke="#16181c" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M2 -10.5 V-4.5 H8" fill="none" stroke="#16181c" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M-4.5 -1 H4.5 M-4.5 3 H4.5 M-4.5 7 H1.5" stroke="#8a5a14" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g id="chipG">
      <path d="M-8 -10.5 H2 L8 -4.5 V10.5 H-8 Z" fill="#1e7a45" stroke="#1e7a45" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M2 -10.5 V-4.5 H8" fill="none" stroke="#9fcfb3" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M-4.5 2 L-1.5 5.5 L4.5 -1.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="chipR">
      <path d="M-8 -10.5 H2 L8 -4.5 V10.5 H-8 Z" fill="#b3261e" stroke="#b3261e" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M2 -10.5 V-4.5 H8" fill="none" stroke="#f0b8b2" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M-3.5 -1 L3.5 6 M3.5 -1 L-3.5 6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <filter id="blur" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <style>
