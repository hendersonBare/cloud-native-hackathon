  .h-r3r{animation:kr3r 15s linear infinite}
  .h-c0a{animation:kc0a 15s linear infinite}
  .h-c0b{animation:kc0b 15s linear infinite}
  .h-c1a{animation:kc1a 15s linear infinite}
  .h-c1b{animation:kc1b 15s linear infinite}
  .h-c2a{animation:kc2a 15s linear infinite}
  .h-c2b{animation:kc2b 15s linear infinite}
  .lock{animation:klock 7.5s ease-in-out infinite}
